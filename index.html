<title>Logowanie – Strefa Belfra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg2:#F6F8FC;--fg:#14213D;--or:#FF7A1A;--gr:#2E9A52;--line:#E3E8F2;--muted:#55627F;--err:#C62828;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg2);color:var(--fg);font-family:Poppins,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px 28px;box-shadow:0 12px 35px rgba(20,33,61,.06)}
.logo{display:block;width:190px;margin:0 auto 22px}.logo svg{width:100%;height:auto;display:block}
h1{font-size:22px;margin:0 0 6px;text-align:center}
.sub{margin:0 0 20px;text-align:center;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:999px;padding:4px;margin-bottom:22px}
.tabs button{border:0;background:none;font:600 14px Poppins,sans-serif;padding:10px;border-radius:999px;color:var(--muted);cursor:pointer;transition:all .3s var(--ease)}
.tabs button[aria-selected=true]{background:#fff;color:var(--fg);box-shadow:0 2px 10px rgba(20,33,61,.1)}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.f{margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=email],input[type=password]{width:100%;font:400 15px Poppins,sans-serif;color:var(--fg);padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(255,122,26,.15)}
.pw{position:relative}.pw input{padding-right:70px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font:600 12px Poppins,sans-serif;color:var(--muted);padding:8px;cursor:pointer}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:400;color:var(--muted);margin:0 0 14px;cursor:pointer}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--or);flex:none}
.chk a,.lnk{color:var(--fg);font-weight:600}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.between .chk{margin:0}
.btn{width:100%;border:0;cursor:pointer;background:var(--or);color:var(--fg);font:600 15px Poppins,sans-serif;padding:13px 24px;border-radius:999px;box-shadow:0 8px 24px rgba(255,122,26,.28);transition:all .3s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,122,26,.38)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.o{background:#fff;color:var(--fg);box-shadow:none;border:1.5px solid var(--line);margin-top:10px}
.link{background:none;border:0;padding:0;font:600 13px Poppins,sans-serif;color:var(--fg);text-decoration:underline;cursor:pointer}
#msg{font-size:14px;padding:12px 14px;border-radius:14px;margin-bottom:16px}
#msg.err{background:#FDECEA;color:var(--err)}#msg.ok{background:rgba(46,154,82,.12);color:#1F6E3A}
.center{text-align:center}.ico{width:56px;height:56px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;background:rgba(46,154,82,.12);color:var(--gr);font-size:26px}
.back{margin-top:16px;text-align:center}
[hidden]{display:none!important}
</style>
</head>

<section id="v-auth" hidden>
 <div class="tabs" role="tablist">
  <button type="button" id="t-login" role="tab" aria-selected="true">Logowanie</button>
  <button type="button" id="t-reg" role="tab" aria-selected="false">Rejestracja</button>
 </div>

 <form id="f-login" novalidate>
  <div class="f"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="email" required></div>
  <div class="f"><label for="l-pass">Hasło</label><div class="pw"><input id="l-pass" type="password" autocomplete="current-password" required><button type="button" data-eye>Pokaż</button></div></div>
  <div class="between">
   <label class="chk"><input id="l-remember" type="checkbox" checked>Zapamiętaj mnie</label>
   <button type="button" class="link" id="to-forgot">Nie pamiętasz hasła?</button>
  </div>
  <button class="btn" type="submit">Zaloguj się</button>
 </form>

 <form id="f-reg" novalidate hidden>
  <div class="row">
   <div class="f"><label for="r-first">Imię</label><input id="r-first" type="text" autocomplete="given-name" required></div>
   <div class="f"><label for="r-last">Nazwisko</label><input id="r-last" type="text" autocomplete="family-name" required></div>
  </div>
  <div class="f"><label for="r-email">E-mail</label><input id="r-email" type="email" autocomplete="email" required></div>
  <div class="f"><label for="r-pass">Hasło (min. 8 znaków)</label><div class="pw"><input id="r-pass" type="password" autocomplete="new-password" minlength="8" required><button type="button" data-eye>Pokaż</button></div></div>
  <label class="chk"><input id="r-terms" type="checkbox" required><span>Akceptuję <a href="https://strefabelfra.pages.dev/regulamin" target="_blank" rel="noopener">Regulamin serwisu</a> oraz <a href="https://strefabelfra.pages.dev/polityka-prywatnosci" target="_blank" rel="noopener">Politykę prywatności</a>.</span></label>
  <button class="btn" type="submit">Utwórz konto</button>
 </form>
</section>

<section id="v-forgot" hidden>
 <h1>Reset hasła</h1><p class="sub">Podaj e-mail konta, a wyślemy Ci link do ustawienia nowego hasła.</p>
 <form id="f-forgot" novalidate>
  <div class="f"><label for="f-email">E-mail</label><input id="f-email" type="email" autocomplete="email" required></div>
  <button class="btn" type="submit">Wyślij link</button>
 </form>
 <div class="back"><button type="button" class="link" data-back>← Wróć do logowania</button></div>
</section>

<section id="v-newpass" hidden>
 <h1>Nowe hasło</h1><p class="sub">Ustaw nowe hasło do swojego konta.</p>
 <form id="f-newpass" novalidate>
  <div class="f"><label for="n-pass">Nowe hasło (min. 8 znaków)</label><div class="pw"><input id="n-pass" type="password" autocomplete="new-password" required><button type="button" data-eye>Pokaż</button></div></div>
  <div class="f"><label for="n-pass2">Powtórz hasło</label><input id="n-pass2" type="password" autocomplete="new-password" required></div>
  <button class="btn" type="submit">Zapisz hasło</button>
 </form>
</section>

<section id="v-info" class="center" hidden>
 <div class="ico">✓</div><h1 id="i-title"></h1><p class="sub" id="i-text"></p>
 <button class="btn" id="i-btn" type="button"></button>
</section>
</main>

<script type="module">
const SUPABASE_URL = "https://zmnscevlotwpocpwzmjj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptbnNjZXZsb3R3cG9jcHd6bWpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzcwMzAsImV4cCI6MjEwODUxMzAzMH0.qB4WcrlkDb75Buk0G2E1-jkun0VLWih7h1j9NEb2IXk";
const SITE_URL  = "https://strefabelfra.pages.dev";                          // strona główna
const APP_URL   = "https://moja-strefabelfra.pages.dev";                           // Moja Strefa Belfra
const LOGIN_URL = "https://login-strefabelfra.pages.dev";                         // ta strona
const HANDOFF   = true; 
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

const FLAG = "sb_remember";
const store = {
  getItem: k => localStorage.getItem(k) ?? sessionStorage.getItem(k),
  setItem: (k, v) => { const r = localStorage.getItem(FLAG) !== "0"; (r ? localStorage : sessionStorage).setItem(k, v); (r ? sessionStorage : localStorage).removeItem(k); },
  removeItem: k => { localStorage.removeItem(k); sessionStorage.removeItem(k); }
};

const hp = new URLSearchParams(location.hash.slice(1)); 
const hashType = hp.get("type"), hashErr = hp.get("error_code");
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storage: store, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

const $ = s => document.querySelector(s);
const views = ["auth", "forgot", "newpass", "info"];
const show = v => { views.forEach(x => $("#v-" + x).hidden = x !== v); msg(""); };
const msg = (t, ok) => { const m = $("#msg"); m.textContent = t || ""; m.hidden = !t; m.className = ok ? "ok" : "err"; };
const busy = (f, on) => { const b = f.querySelector(".btn"); b.disabled = on; };
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
$("#logo").href = SITE_URL;

function info(title, text, label, fn) {
  $("#i-title").textContent = title; $("#i-text").textContent = text; $("#i-btn").textContent = label; $("#i-btn").onclick = fn; show("info");
}
function tab(reg) {
  $("#f-login").hidden = reg; $("#f-reg").hidden = !reg;
  $("#t-login").setAttribute("aria-selected", !reg); $("#t-reg").setAttribute("aria-selected", reg); msg("");
}
function go(s) {
  location.replace(APP_URL + (HANDOFF && s ? "#access_token=" + encodeURIComponent(s.access_token) + "&refresh_token=" + encodeURIComponent(s.refresh_token) : ""));
}
function err(e) {
  const m = (e?.message || "").toLowerCase();
  if (m.includes("invalid login")) return "Nieprawidłowy e-mail lub hasło.";
  if (m.includes("not confirmed")) return "Potwierdź adres e-mail – kliknij link z wiadomości, którą wysłaliśmy po rejestracji.";
  if (m.includes("rate limit") || m.includes("too many") || e?.status === 429) return "Zbyt wiele prób. Spróbuj ponownie za kilka minut.";
  if (m.includes("same password")) return "Nowe hasło musi różnić się od poprzedniego.";
  if (m.includes("weak") || m.includes("at least")) return "Hasło jest zbyt słabe – użyj min. 8 znaków.";
  if (m.includes("failed to fetch") || m.includes("network")) return "Brak połączenia z serwerem. Sprawdź internet.";
  return "Coś poszło nie tak. Spróbuj ponownie.";
}

$("#t-login").onclick = () => tab(false);
$("#t-reg").onclick = () => tab(true);
$("#to-forgot").onclick = () => { $("#f-email").value = $("#l-email").value; show("forgot"); };
document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => { show("auth"); tab(false); });
document.querySelectorAll("[data-eye]").forEach(b => b.onclick = () => {
  const i = b.previousElementSibling, h = i.type === "password"; i.type = h ? "text" : "password"; b.textContent = h ? "Ukryj" : "Pokaż";
});

$("#f-login").onsubmit = async e => {
  e.preventDefault(); const f = e.target;
  const email = $("#l-email").value.trim(), password = $("#l-pass").value;
  if (!emailOk(email) || !password) return msg("Podaj poprawny e-mail i hasło.");
  busy(f, true);
  localStorage.setItem(FLAG, $("#l-remember").checked ? "1" : "0");
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { busy(f, false); return msg(err(error)); }
  go(data.session);
};

$("#f-reg").onsubmit = async e => {
  e.preventDefault(); const f = e.target;
  const first = $("#r-first").value.trim(), last = $("#r-last").value.trim(), email = $("#r-email").value.trim(), password = $("#r-pass").value;
  if (!first || !last) return msg("Podaj imię i nazwisko.");
  if (!emailOk(email)) return msg("Podaj poprawny adres e-mail.");
  if (password.length < 8) return msg("Hasło musi mieć co najmniej 8 znaków.");
  if (!$("#r-terms").checked) return msg("Zaakceptuj Regulamin i Politykę prywatności, aby utworzyć konto.");
  busy(f, true);
  localStorage.setItem(FLAG, "1");
  const { error } = await sb.auth.signUp({ email, password, options: {
    emailRedirectTo: LOGIN_URL + "/",
    data: { first_name: first, last_name: last, full_name: first + " " + last, accepted_terms: true, accepted_terms_at: new Date().toISOString() }
  }});
  busy(f, false);
  if (error) return msg(err(error));
  f.reset();
  info("Sprawdź skrzynkę", "Wysłaliśmy link aktywacyjny na adres " + email + ". Kliknij go, aby potwierdzić konto. Jeśli nie widzisz wiadomości, zajrzyj do spamu.", "Wróć do logowania", () => { show("auth"); tab(false); });
};

$("#f-forgot").onsubmit = async e => {
  e.preventDefault(); const f = e.target; const email = $("#f-email").value.trim();
  if (!emailOk(email)) return msg("Podaj poprawny adres e-mail.");
  busy(f, true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: LOGIN_URL + "/" });
  busy(f, false);
  if (error && (error.status === 429 || /rate/i.test(error.message))) return msg(err(error));
  info("Link wysłany", "Jeśli konto z adresem " + email + " istnieje, wysłaliśmy na nie link do ustawienia nowego hasła.", "Wróć do logowania", () => { show("auth"); tab(false); });
};

$("#f-newpass").onsubmit = async e => {
  e.preventDefault(); const f = e.target; const p = $("#n-pass").value, p2 = $("#n-pass2").value;
  if (p.length < 8) return msg("Hasło musi mieć co najmniej 8 znaków.");
  if (p !== p2) return msg("Hasła nie są takie same.");
  busy(f, true);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { busy(f, false); show("forgot"); return msg("Link wygasł. Poproś o nowy."); }
  const { error } = await sb.auth.updateUser({ password: p });
  if (error) { busy(f, false); return msg(err(error)); }
  await sb.auth.signOut(); f.reset(); busy(f, false);
  history.replaceState(null, "", location.pathname);
  info("Hasło zmienione", "Możesz już zalogować się nowym hasłem.", "Przejdź do logowania", () => { show("auth"); tab(false); });
};

sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") show("newpass"); });

(async () => {
  if (hashErr) {
    history.replaceState(null, "", location.pathname); show("forgot");
    return msg("Link wygasł lub został już użyty. Poproś o nowy.");
  }
  if (hashType === "recovery") return show("newpass");
  const { data: { session } } = await sb.auth.getSession();
  if (hashType === "signup") {
    history.replaceState(null, "", location.pathname);
    return session
      ? info("Konto potwierdzone", "Twój adres e-mail został zweryfikowany. Witamy w Strefie Belfra!", "Przejdź do Mojej Strefy", () => go(session))
      : info("Konto potwierdzone", "Twój adres e-mail został zweryfikowany. Możesz się zalogować.", "Zaloguj się", () => { show("auth"); tab(false); });
  }
  if (session) return go(session);
  show("auth");
})();
</script>
</body>
</html>
